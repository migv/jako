<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 215" role="img" aria-label="A sloth hanging from a branch">
  <!-- arms reaching up to the branch -->
  <g stroke="#7d6850" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M70 122 Q58 70 68 10"/>
    <path d="M130 122 Q142 70 132 10"/>
  </g>
  <!-- claws gripping the branch -->
  <g stroke="#3b2d22" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M60 6 q-2 8 0 14 M68 4 q0 9 0 16 M76 6 q2 8 0 14"/>
    <path d="M124 6 q-2 8 0 14 M132 4 q0 9 0 16 M140 6 q2 8 0 14"/>
  </g>
  <!-- legs -->
  <ellipse cx="78" cy="190" rx="12" ry="17" fill="#7d6850"/>
  <ellipse cx="122" cy="190" rx="12" ry="17" fill="#7d6850"/>
  <g stroke="#3b2d22" stroke-width="3" stroke-linecap="round">
    <path d="M70 204 v8 M78 206 v8 M86 204 v8"/>
    <path d="M114 204 v8 M122 206 v8 M130 204 v8"/>
  </g>
  <!-- body -->
  <ellipse cx="100" cy="150" rx="44" ry="52" fill="#a08a72"/>
  <ellipse cx="100" cy="160" rx="27" ry="34" fill="#c3b194"/>
  <!-- head -->
  <circle cx="100" cy="92" r="38" fill="#a08a72"/>
  <ellipse cx="100" cy="98" rx="31" ry="29" fill="#e6d8b8"/>
  <!-- the sloth eye stripes -->
  <ellipse cx="82" cy="90" rx="14" ry="7.5" fill="#4a392b" transform="rotate(-28 82 90)"/>
  <ellipse cx="118" cy="90" rx="14" ry="7.5" fill="#4a392b" transform="rotate(28 118 90)"/>
  <circle cx="86" cy="89" r="3.8" fill="#14100c"/>
  <circle cx="114" cy="89" r="3.8" fill="#14100c"/>
  <circle cx="87.2" cy="87.8" r="1.2" fill="#fff"/>
  <circle cx="115.2" cy="87.8" r="1.2" fill="#fff"/>
  <!-- nose and smile -->
  <ellipse cx="100" cy="102" rx="7" ry="5" fill="#2b2018"/>
  <path d="M86 110 Q100 124 114 110" fill="none" stroke="#4a392b" stroke-width="3" stroke-linecap="round"/>
</svg>
